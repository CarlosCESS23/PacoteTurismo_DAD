
spring:
  application:
    name: PacoteTurismo

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB}
    username: ${POST_USER}
    password: ${POST_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
